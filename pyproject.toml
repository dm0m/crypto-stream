[tool.pytest.ini_options]
markers = [
    "integration: real Postgres/Redis via testcontainers; slower, excluded by default",
]
addopts = "-m 'not integration'"
timeout = 30
timeout_method = "thread"

[tool.mypy]
python_version = "3.12"
files = ["core", "domain", "ingestion", "processing", "storage", "main.py", "tests"]
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["asyncpg.*"]
ignore_missing_imports = true

[tool.ruff]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

# Same as Black.
line-length = 88
indent-width = 4

target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "ASYNC", "PT", "RUF"]
# E501: the formatter owns code line length; what remains is docstrings and
# messages, where wrapping hurts more than a long line.
ignore = ["E501"]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = false
docstring-code-line-length = "dynamic"